name: test

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  instrumented-test:
    name: Instrumented tests (Android TV API 28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo "KERNEL_MODULES=$(ls /lib/modules/$(uname -r))" >> $GITHUB_ENV
          sudo sysctl -w kernel.kptr_restrict=0 || true
      - name: Run instrumented tests on API 28 TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: tv_1080p
          script: ./gradlew connectedDebugAndroidTest

  coverage:
    name: JaCoCo coverage (>= 80%)
    runs-on: ubuntu-latest
    needs: [unit-test, instrumented-test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate JaCoCo report
        run: ./gradlew jacocoTestReport
      - name: Check coverage threshold
        run: ./gradlew jacocoTestCoverageVerification
